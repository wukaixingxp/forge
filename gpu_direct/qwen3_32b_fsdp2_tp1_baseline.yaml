# GPU-Direct Weight Sync GRPO - Qwen3-32B BASELINE with FSDP=2, TP=1
# Trainer: 2 GPUs (FSDP), Generator: 1 GPU (TP=1)
# Baseline using TorchStore for comparison
#
# Usage:
#   python -m apps.gpu_direct.main --config apps/gpu_direct/qwen3_32b_fsdp2_tp1_baseline.yaml

# Weight sync configuration - BASELINE MODE
weight_sync:
  use_ipc: false  # Use TorchStore (baseline)

# Global configuration
group_size: 4
local_batch_size: 1
max_req_tokens: 256
max_res_tokens: 128  # Reduced for faster 32B benchmarks
model: "Qwen/Qwen3-32B"
off_by_n: 1
compile: false

# Main loop configuration
rollout_threads: 1

# Observability configuration
metric_logging:
  wandb:
    project: kaiwu-gpu-grpo
    group: qwen3_32b_fsdp2_tp1_baseline
    logging_mode: global_reduce
  console:
    logging_mode: global_reduce

# Dataset configuration
dataset:
  path: "openai/gsm8k"
  revision: "main"
  data_split: "train"
  streaming: true
  model: ${model}

# Generator configuration (TP=1, 1 GPU)
generator:
  prefetch_weights_to_shm: false  # Direct TorchStore fetch
  engine_args:
    model: ${model}
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    enforce_eager: true
    max_model_len: 2048
    gpu_memory_utilization: 0.90
  sampling_params:
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0
    top_p: 1.0
    logprobs: 1

# Trainer configuration (FSDP=2, 2 GPUs)
trainer:
  model:
    name: qwen3
    flavor: 32B
    hf_assets_path: hf://${model}
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8
  lr_scheduler:
    warmup_steps: 1
  training:
    local_batch_size: ${local_batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 2  # Quick benchmark
    dtype: bfloat16
    gc_freq: 1
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 2
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true
  checkpoint:
    enable: false
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

# Replay buffer configuration
replay_buffer:
  batch_size: ${local_batch_size}
  max_policy_age: ${off_by_n}
  dp_size: ${trainer.parallelism.data_parallel_shard_degree}

# Resource allocations (3 GPUs total)
services:
  generator:
    procs: 1
    num_replicas: 1
    with_gpus: true
    mesh_name: generator
  reward_actor:
    procs: 1
    num_replicas: 1
    with_gpus: false
    mesh_name: reward_actor

actors:
  dataset:
    procs: 1
    with_gpus: false
    mesh_name: dataset
  trainer:
    procs: 2
    with_gpus: true
    mesh_name: trainer
  replay_buffer:
    procs: 1
    with_gpus: false
    mesh_name: replay_buffer
  compute_advantages:
    procs: 1
    with_gpus: false
    mesh_name: compute_advantages

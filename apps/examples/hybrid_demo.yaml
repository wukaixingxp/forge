# Hybrid Policy Actor Demo Configuration
# >>> python -m apps.examples.hybrid_demo --config apps/examples/hybrid_demo.yaml
#
# This demo showcases all Phase 1 + Phase 2 features:
# - Zero-copy weight sharing (20-100x faster sync)
# - Fast mode switching (~10-50ms)
# - Prefix caching (2-5x speedup for shared prompts)
# - CUDA graphs (1.3-1.8x faster decoding)
# - Paged KV cache (2-3x higher batch size)

# Model configuration (using small model for quick demo)
model: "Qwen/Qwen3-1.7B"

# Observability configuration
metric_logging:
  console:
    logging_mode: global_reduce

# Hybrid Policy Actor configuration
hybrid_policy:
  # Model config
  model:
    name: qwen3
    flavor: 1.7B
    hf_assets_path: hf://${model}

  # Optimizer config
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8

  # Learning rate scheduler
  lr_scheduler:
    warmup_steps: 1

  # Training config
  training:
    local_batch_size: 4
    seq_len: 512  # Smaller for demo
    max_norm: 1.0
    steps: 100
    dtype: bfloat16
    gc_freq: 1

  # Compilation
  compile:
    enable: false  # Disabled for demo (faster startup)

  # Parallelism (single GPU for demo)
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1  # Single GPU
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true

  # Checkpoint config
  checkpoint:
    enable: true
    folder: ./checkpoint_hybrid_demo
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: false
    interval: 1000  # Don't checkpoint during demo
    async_mode: "disabled"

  # Activation checkpointing
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

  # Phase 2 Inference optimizations (ALL ENABLED for demo)
  inference:
    enable_prefix_cache: true   # ✓ Hash-based prefix matching (2-5x speedup)
    enable_cuda_graphs: true    # ✓ Graph capture for decode (1.3-1.8x speedup)
    enable_paged_kv_cache: true # ✓ Block-based KV memory (2-3x batch size)
    max_batch_size: 8

  # Sampling params for generation
  sampling_params:
    n: 4
    max_tokens: 100
    temperature: 0.7
    top_p: 0.9
    logprobs: 1  # Required for RL training

# Actor resource allocation
actors:
  hybrid_policy:
    procs: 1  # Single GPU for demo
    with_gpus: true
    mesh_name: hybrid_policy

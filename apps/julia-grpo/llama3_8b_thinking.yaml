# Grouped Relative Policy Optimization (GRPO) for Code Generation - Hard Dataset
# >>> python -m apps.coding-grpo.main --config apps/coding-grpo/llama3_8b_hard.yaml

# Global configuration
group_size: 10  # ✅ INCREASED from 16 to 32 for better reward diversity and learning signal on hard dataset
batch_size: 4   # Reduced to 8 to avoid OOM with seq_len=3072
max_req_tokens: 1024  # Increased for coding prompts with examples
max_res_tokens: 4096  # Increased for longer code generation with thinking
model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
off_by_n: 1 # Off by one by default

# Main loop configuration
rollout_threads: 1   # Recommended to set equal to policy.num_replicas


# Observability configuration
# Observability configuration
metric_logging:
  wandb:
    entity: "torchforge"
    project: "kaiwu-coding-grpo"
    logging_mode: global_reduce
  console:
    logging_mode: global_reduce
    log_per_rank: True  # Enable per-rank logging to see actor-specific logs


# Dataset configuration
dataset:
  path: "/home/kaiwu/work/kaiwu/AceCoder/train/train_rl/OpenRLHF/scripts/data/acecode_89k/acecode_hard02.json"
  #path: "/home/kaiwu/work/kaiwu/AceCoder/train/train_rl/OpenRLHF/data/acecode_87K/acecode_87K.json"
  revision: "main"
  data_split: "train"
  streaming: false
  model: ${model}

# Policy configuration
policy:
  engine_args:  # https://docs.vllm.ai/en/v0.10.0/api/vllm/engine/arg_utils.html#vllm.engine.arg_utils.EngineArgs
    model: ${model}
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    enforce_eager: false
    gpu_memory_utilization: 0.85  # Reduced from 0.85 to leave more memory for trainer
    max_model_len: 8192
    enable_chunked_prefill: true
    max_num_batched_tokens: 8192
    max_num_seqs: 32  # Reduced from 24 to reduce memory pressure
  sampling_params:  # https://docs.vllm.ai/en/v0.10.0/api/vllm/sampling_params.html#vllm.sampling_params.SamplingParams
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0  # ✅ FIXED: Increased to 1.0 for maximum exploration during RL training
    top_p: 1.0

# Trainer configuration
trainer:
  model:
    name: llama3
    flavor: 8B
    hf_assets_path: hf://${model}
  optimizer:
    name: AdamW
    lr: 5e-6  # ✅ REDUCED from 5e-5 to 5e-6 to prevent rapid policy divergence and reward collapse
    eps: 1e-8  # ✅ FIXED: Changed from 1e-9 to 1e-8 for better numerical stability
  lr_scheduler:
    warmup_steps: 1
  training:
    local_batch_size: ${batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}  # seq_len >= max_req_tokens + max_res_tokens
    max_norm: 1.0
    steps: 1500
    dtype: float16
    gc_freq: 1
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true
  checkpoint:
    enable: true
    folder: "checkpoint_llama3_8b_hard"
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 100
    async_mode: "disabled"
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

# Replay buffer configuration
replay_buffer:
  batch_size: ${batch_size}
  max_policy_age: ${off_by_n}
  dp_size: ${trainer.parallelism.data_parallel_shard_degree} # Must equal trainer DP degree

# Reference model configuration
ref_model:
  model:
    name: llama3
    flavor: 8B
    hf_assets_path: hf://${model}
  training:
    seq_len: ${trainer.training.seq_len}
    dtype: float16
    gc_freq: 1
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
  checkpoint:
    enable: true
    initial_load_path: hf://${model}
    initial_load_in_hf: true

# All resource allocations
services:
  policy:
    procs: ${policy.engine_args.tensor_parallel_size}
    num_replicas: 1
    mesh_name: policy
    with_gpus: true
  ref_model:
    procs: 1
    num_replicas: 1
    mesh_name: ref_model
    with_gpus: true
  reward_actor:
    procs: 1
    num_replicas: 1
    mesh_name: reward_actor
    with_gpus: false

actors:
  dataset:
    procs: 1
    with_gpus: false
    mesh_name: dataset
  trainer:
    procs: 1
    with_gpus: true
    mesh_name: trainer
  replay_buffer:
    procs: 1
    with_gpus: false
    mesh_name: replay_buffer
  compute_advantages:
    procs: 1
    with_gpus: false
    mesh_name: compute_advantages

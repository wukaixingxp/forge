# Simple KV Cache - GRPO Training with Single Model Copy
# >>> python -m apps.grpo.main_hybrid --config apps/hybrid/simple_kv_cache.yaml
#
# Solution: Simple KV Cache (nano-vLLM style)
# Model Copies: 1 (training + inference share same model in GPU memory)
# Memory: ~23GB (15GB model + 8GB KV cache)
# Speed: 10-20x faster than naive generation
# Complexity: Low (~600 lines of logic)

# Global configuration
group_size: 8
local_batch_size: 8
max_req_tokens: 1024
max_res_tokens: 2048
model: "Qwen/Qwen3-1.7B"
off_by_n: 1
compile: false  # Not compatible with Simple KV Cache yet

# Main loop configuration
rollout_threads: 1

# Observability configuration
metric_logging:
  console:
    logging_mode: global_reduce

# Dataset configuration
dataset:
  path: "openai/gsm8k"
  revision: "main"
  data_split: "train"
  streaming: true
  model: ${model}

# Hybrid Policy Actor configuration (combines training + inference)
hybrid_policy:
  model:
    name: qwen3
    flavor: 1.7B
    hf_assets_path: hf://${model}

  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8

  lr_scheduler:
    warmup_steps: 1

  training:
    local_batch_size: ${local_batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 1000000
    dtype: bfloat16
    gc_freq: 1

  compile:
    enable: ${compile}

  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 2  # FSDP across 2 GPUs
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true

  checkpoint:
    enable: true
    folder: ./checkpoint_simple_kv
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 500
    async_mode: "disabled"

  activation_checkpoint:
    mode: selective
    selective_ac_option: op

  # Inference config - Simple KV Cache
  inference:
    use_simple_kv_cache: true
    simple_kv_cache_num_blocks: 256
    simple_kv_cache_block_size: 256
    max_batch_size: 16

  # Sampling params
  sampling_params:
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0
    top_p: 1.0
    logprobs: 1

# Replay buffer configuration
replay_buffer:
  batch_size: ${local_batch_size}
  max_policy_age: ${off_by_n}
  dp_size: ${hybrid_policy.parallelism.data_parallel_shard_degree}

# Services
services:
  reward_actor:
    procs: 1
    num_replicas: 1
    mesh_name: reward_actor
    with_gpus: false

actors:
  dataset:
    procs: 1
    with_gpus: false
    mesh_name: dataset
  hybrid_policy:
    procs: 2
    with_gpus: true
    mesh_name: hybrid_policy
  replay_buffer:
    procs: 1
    with_gpus: false
    mesh_name: replay_buffer
  compute_advantages:
    procs: 1
    with_gpus: false
    mesh_name: compute_advantages

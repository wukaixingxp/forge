# Grouped Relative Policy Optimization (GRPO) with HybridPolicyActor (1 GPU test)
# >>> python -m apps.grpo.main_hybrid --config apps/grpo/qwen3_1_7b_hybrid_1gpu.yaml

# Global configuration
group_size: 4  # Reduced for 1 GPU
local_batch_size: 4  # Reduced for 1 GPU
max_req_tokens: 512  # Reduced for faster testing
max_res_tokens: 512  # Reduced for faster testing
model: "Qwen/Qwen3-1.7B"
off_by_n: 1 # Off by one by default
compile: false  # Disabled for faster startup during testing

# Main loop configuration
rollout_threads: 1

# Observability configuration
metric_logging:
  wandb:
    mode: disabled  # Set to 'online' or 'offline' to enable wandb
    project: grpo-training-hybrid
    group: grpo_hybrid_exp_${oc.env:USER}
    logging_mode: global_reduce # global_reduce, per_rank_reduce, per_rank_no_reduce
  console:
    logging_mode: global_reduce

# Dataset configuration
dataset:
  path: "openai/gsm8k"
  revision: "main"
  data_split: "train"
  streaming: true
  model: ${model}

# Hybrid Policy Actor configuration (combines training + inference)
hybrid_policy:
  # Model config
  model:
    name: qwen3
    flavor: 1.7B
    hf_assets_path: hf://${model}

  # Optimizer config
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8

  # Learning rate scheduler
  lr_scheduler:
    warmup_steps: 1

  # Training config
  training:
    local_batch_size: ${local_batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 10  # Just 10 steps for testing
    dtype: bfloat16
    gc_freq: 1

  # Compilation
  compile:
    enable: ${compile}

  # Parallelism (NO FSDP for 1 GPU)
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1  # No sharding for 1 GPU
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true

  # Checkpoint config
  checkpoint:
    enable: true
    folder: ./checkpoint_hybrid_1gpu
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 500
    async_mode: "disabled"

  # Activation checkpointing
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

  # Inference config
  inference:
    # TorchTitan + vLLM integration (single model copy with paged KV cache)
    use_torchtitan_vllm: true  # Use TorchTitan model with vLLM paged attention
    use_nano_vllm: false  # Separate nano-vLLM model (if torchtitan_vllm disabled)
    nano_vllm_tensor_parallel_size: 1  # Not used when torchtitan_vllm enabled
    enable_cuda_graphs: true  # CUDA graphs for decode
    max_batch_size: 8
    # Legacy options (only used with custom InferenceEngine)
    enable_prefix_cache: false
    enable_paged_kv_cache: false

  # Sampling params for generation
  sampling_params:
    n: ${group_size}
    max_tokens: 50  # Reduced for faster testing (was ${max_res_tokens})
    temperature: 1.0
    top_p: 1.0
    logprobs: 1  # returns log probabilities for sampled tokens

# Replay buffer configuration
replay_buffer:
  batch_size: ${local_batch_size}
  max_policy_age: ${off_by_n}
  dp_size: ${hybrid_policy.parallelism.data_parallel_shard_degree}

# Reference model configuration (if enabled in services)
ref_model:
  model:
    name: qwen3
    flavor: 1.7B
    hf_assets_path: hf://${model}
  training:
    seq_len: ${hybrid_policy.training.seq_len}
    dtype: bfloat16
    gc_freq: 1
  compile:
    enable: ${compile}
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
  checkpoint:
    enable: true
    initial_load_path: hf://${model}
    initial_load_in_hf: true

# All resource allocations
services:
  # Ref model is only necessary if the loss requires it (GRPO with beta>0),
  # but we recommend using DAPO instead
  # ref_model:
  #   procs: 1
  #   num_replicas: 1
  #   with_gpus: true
  #   mesh_name: ref_model
  reward_actor:
    procs: 1
    num_replicas: 1
    mesh_name: reward_actor
    with_gpus: false

actors:
  dataset:
    procs: 1
    with_gpus: false
    mesh_name: dataset
  hybrid_policy:
    procs: 1  # Single GPU, no FSDP sharding
    with_gpus: true
    mesh_name: hybrid_policy
  replay_buffer:
    procs: 1
    with_gpus: false
    mesh_name: replay_buffer
  compute_advantages:
    procs: 1
    with_gpus: false
    mesh_name: compute_advantages

# GPU-Direct Weight Sync GRPO - Qwen3-4B with CUDA IPC
# Trainer: 1 GPU (no FSDP), Generator: 1 GPU (TP=1)
# Optimized for throughput: multi-step training, demand-driven rollouts
#
# Usage:
#   export FORGE_IPC_GPU_VISIBILITY=1
#   python -m apps.gpu_direct.main --config apps/gpu_direct/qwen3_4b_2x2.yaml

# Weight sync configuration
weight_sync:
  use_ipc: true  # Enable CUDA IPC direct transfer

# Global configuration
group_size: 8
local_batch_size: 2
max_req_tokens: 256   # GSM8K prompts are short, 256 is sufficient
max_res_tokens: 2048  # Let model generate freely, reduce truncation
model: "Qwen/Qwen3-4B"
off_by_n: 2           # Allow 1-step-stale episodes to reduce buffer starvation
compile: false

# Main loop configuration
rollout_threads: 4    # Concurrent rollout coroutines for higher gen throughput
weight_sync_interval: 4  # Train 4 steps per weight sync to amortize pause overhead

# Observability configuration
metric_logging:
  wandb:
    project: kaiwu-gpu-grpo
    group: qwen3_4b_ipc
    logging_mode: global_reduce
  console:
    logging_mode: global_reduce

# Dataset configuration
dataset:
  path: "openai/gsm8k"
  revision: "main"
  data_split: "train"
  streaming: true
  model: ${model}

# Generator configuration (TP=1, 1 GPU - no parallelism overhead)
generator:
  engine_args:
    model: ${model}
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    enforce_eager: true
    max_model_len: 4096
    gpu_memory_utilization: 0.85
  sampling_params:
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0
    top_p: 1.0
    logprobs: 1

# Trainer configuration (FSDP=1, 1 GPU - no sharding overhead)
trainer:
  model:
    name: qwen3
    flavor: 4B
    hf_assets_path: hf://${model}
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8
  lr_scheduler:
    warmup_steps: 1
  training:
    local_batch_size: ${local_batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 20  # 20 train steps = 5 weight syncs at interval=4
    dtype: bfloat16
    gc_freq: 1
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1  # No FSDP - single GPU
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true
  checkpoint:
    enable: false
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

# Replay buffer configuration
replay_buffer:
  batch_size: ${local_batch_size}
  max_policy_age: ${off_by_n}
  dp_size: 1  # Single trainer

# Resource allocations (2 GPUs: 1 trainer + 1 generator)
services:
  generator:
    procs: 1
    num_replicas: 1
    with_gpus: true
    mesh_name: generator
  reward_actor:
    procs: 1
    num_replicas: 1
    with_gpus: false
    mesh_name: reward_actor

actors:
  dataset:
    procs: 1
    with_gpus: false
    mesh_name: dataset
  trainer:
    procs: 1  # Single GPU trainer
    with_gpus: true
    mesh_name: trainer
  replay_buffer:
    procs: 1
    with_gpus: false
    mesh_name: replay_buffer
  compute_advantages:
    procs: 1
    with_gpus: false
    mesh_name: compute_advantages
